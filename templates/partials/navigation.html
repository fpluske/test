{% load static %}
<nav class="chapter-nav" aria-label="Hlavní navigace">
  <a class="nav-brand" href="{% url 'school:home' %}" aria-label="ZŠ a MŠ Bolatice – hlavní stránka">
    <img src="{% static 'img/logo.png' %}" alt="ZŠ a MŠ Bolatice" />
  </a>
  {% for item in categories %}
    <article class="chapter chapter--{{ item.class }}">
      <button class="chapter-toggle" type="button" data-page="{% url item.url_name %}" aria-expanded="false" aria-controls="{{ item.slug }}-menu">
        <span class="chapter-icon" aria-hidden="true">{{ item.icon }}</span>
        <span class="chapter-name">{{ item.name }}</span>
        <span class="chapter-arrow" aria-hidden="true">↘</span>
      </button>
      <div class="book-menu" id="{{ item.slug }}-menu">
        <p class="menu-kicker">{{ item.chapter }}</p>
        {% for page_slug, label in item.links %}<a data-category="{{ item.class }}" href="{% url item.sub_url_name page_slug=page_slug %}">{{ label }} <span>→</span></a>{% endfor %}
      </div>
    </article>
  {% endfor %}
</nav>
